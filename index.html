<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fractal Fight</title>
<meta name="theme-color" content="#070a18">
<meta name="description" content="A geometric game of recursion. Every shape splits into smaller copies of itself.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fractal Fight">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#070a18;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#dbe8ff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #nova{position:fixed;right:16px;bottom:20px;width:82px;height:82px;border-radius:50%;display:none;
    border:2px solid #4ee0ff66;color:#bfeaff;font-weight:800;letter-spacing:.1em;font-size:13px;--p:0%;
    background:linear-gradient(to top,#4ee0ff77 var(--p),#0b1230dd var(--p));touch-action:manipulation}
  #nova.ready{border-color:#fff;color:#fff;box-shadow:0 0 22px #4ee0ffcc;animation:pulse .8s infinite alternate}
  #mode{position:fixed;left:16px;bottom:20px;width:82px;height:82px;border-radius:50%;display:none;font-weight:800;letter-spacing:.08em;
    font-size:12px;background:#0b1230dd;border:2px solid #7dffb2aa;color:#7dffb2;touch-action:manipulation}
  #mode.focus{border-color:#ffc857cc;color:#ffc857}
  @keyframes pulse{to{box-shadow:0 0 34px #b28cffee}}
  #screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;
    background:radial-gradient(#070a18aa,#070a18ee);overflow:auto}
  .panel{max-width:460px;margin:auto;text-align:center}
  h1{font-size:clamp(34px,10vw,58px);letter-spacing:.14em;margin:0;line-height:1.02;
    background:linear-gradient(90deg,#4ee0ff,#b28cff,#ff5fa8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:6px 0 14px;color:#8fa5d8;letter-spacing:.2em;font-size:12px;text-transform:uppercase}
  .story{font-size:14px;line-height:1.5;color:#b9c9ee;margin:0 0 12px}
  ul{list-style:none;padding:0;margin:0 0 16px;text-align:left;font-size:13px;line-height:1.45;color:#9fb3e0}
  li{margin:6px 0;padding-left:20px;position:relative}
  li:before{content:"\25B3";position:absolute;left:0;color:#4ee0ff}
  b{color:#fff}
  button.go{border:0;border-radius:999px;padding:14px 40px;font-size:16px;font-weight:800;letter-spacing:.12em;color:#070a18;
    background:linear-gradient(90deg,#4ee0ff,#b28cff);touch-action:manipulation}
  .stat{font-size:15px;margin:4px 0;color:#cfe0ff}
  .logo{display:block;margin:0 auto 10px;animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-4px)}}
  .row{display:flex;gap:10px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}
  button.sec{border:1px solid #4a5fa8;background:#0d1533;color:#cfe0ff;border-radius:999px;padding:11px 20px;font-size:13px;font-weight:700;letter-spacing:.08em;touch-action:manipulation}
  button.go.sm{padding:10px 18px;font-size:13px}
  button.sec.sm{padding:8px 14px;font-size:12px}
  button.tog{border:1px solid #4a5fa8;background:#0d1533;color:#9fb3e0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:12px}
  button.tog.on{background:#1b3a5f;color:#7dffb2;border-color:#7dffb2}
  .card{background:#0b1230cc;border:1px solid #243060;border-radius:14px;padding:12px 14px;margin:12px 0;text-align:left;font-size:13px}
  .line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;color:#9fb3e0}
  .line b{color:#fff;font-weight:600;text-align:right}
  .card.log p{margin:6px 0;color:#9fb3e0;line-height:1.4}
  .card.log i{color:#4ee0ff;font-style:normal;font-weight:700;margin-right:4px}
  .ver{margin:16px 0 0;font-size:11px;color:#5e6f9f;letter-spacing:.1em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="nova">NOVA</button>
<button id="mode">BRANCH</button>
<div id="screen"><div class="panel" id="panel"></div></div>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2, F=0.42;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const screenEl=document.getElementById('screen'), panel=document.getElementById('panel'), novaBtn=document.getElementById('nova'), modeBtn=document.getElementById('mode');
let W=0,H=0,DPR=1,U=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U=Math.max(.68,Math.min(1.25,Math.min(W,H)/560));
}
addEventListener('resize',resize); resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
let G=null, state='menu', best=0, bgT=0;
try{best=+localStorage.getItem('ff_best')||0}catch(e){}

/* ---------- story ---------- */
const CH=[
 ['I · The Triangle Tide','Strike a shape and it splits into smaller copies of itself. Unmake them all, down to Depth 0.'],
 ['II · The Square Swarm','Squares split in two, and they never stop coming. Let your shots branch.'],
 ['III · The Pentagon Plague','Five-sided and fast. Shards feed your Recursion: collect them.'],
 ['IV · The Koch Queen','The Void sends its first sovereign. Break the Queen and every copy she contains.']
];
const COL={3:'#4ee0ff',4:'#ff5fa8',5:'#ffc857',boss:'#b28cff'};
const colOf=e=>e.boss?COL.boss:COL[e.sides];

/* ---------- the recursive heart: a polygon that contains smaller copies of itself ---------- */
function poly(x,y,r,rot,n,d){
  ctx.moveTo(x+Math.cos(rot)*r,y+Math.sin(rot)*r);
  for(let i=1;i<=n;i++){const a=rot+i*TAU/n;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}
  if(d>0){
    for(let i=0;i<n;i++){const a=rot+i*TAU/n;poly(x+Math.cos(a)*r,y+Math.sin(a)*r,r*F,rot,n,d-1);}
  }
}

/* ---------- entities ---------- */
const rOf=(d,boss)=>(boss?78:12+d*10)*U;
function mk(sides,depth,x,y,vx,vy,boss){
  return {sides,depth,x,y,vx,vy,r:rOf(depth,boss),rot:rnd(0,TAU),spin:rnd(-1.6,1.6),boss:!!boss,hp:boss?6:1,inv:0,flash:0,ringT:0,shT:0,fam:0,top:depth,gt:0,dead:false};
}
function burst(x,y,c,n,sp){
  if(G.parts.length>700)return;
  for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(.2,1)*sp*U;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.7),max:.7,c,s:rnd(1.5,3.2)*U});}
}
function dropShard(e){G.sh.push({x:e.x,y:e.y,vx:rnd(-50,50)*U,vy:rnd(-50,50)*U,life:10});}
const TYPES=['shield','shield','mirror','mirror','hilbert','magnet','magnet'];
const TCOL={shield:'#6fb7ff',mirror:'#7dffb2',hilbert:'#ffc857',magnet:'#ff8fd0'};
const pickType=()=>TYPES[(Math.random()*TYPES.length)|0];
function dropPair(x,y,life){
  const a=pickType(); let b=pickType(),g=0; while(b===a&&g++<30)b=pickType();
  const id=++G.famN,ang=rnd(0,TAU),d=40*U,cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  for(const [t,s] of [[a,1],[b,-1]])
    G.tok.push({x:cl(x+Math.cos(ang)*d*s,24*U,W-24*U),y:cl(y+Math.sin(ang)*d*s,60*U,H-24*U),life:life||12,type:t,fork:id});
}
function dropTok(e){dropPair(e.x,e.y,12);}
function hil(n,d){let x=0,y=0,t=d;for(let s=1;s<n;s*=2){const rx=(t>>1)&1,ry=(t^rx)&1;if(ry===0){if(rx===1){x=s-1-x;y=s-1-y;}const m=x;x=y;y=m;}x+=s*rx;y+=s*ry;t=t>>2;}return[x,y];}
function startHil(){
  const n=8,top=50*U,cw=W/n,ch=(H-top)/n,pts=[];
  for(let d=0;d<n*n;d++){const p=hil(n,d);pts.push([p[0]*cw+cw/2,top+p[1]*ch+ch/2]);}
  G.hil={i:0,pts,x:pts[0][0],y:pts[0][1]};
}

function hit(e,foc){
  if(e.inv>0||e.dead)return;
  e.hp-=(foc&&e.boss)?2:1; e.flash=.09;
  if(e.hp>0){burst(e.x,e.y,colOf(e),6,130);G.shake=Math.max(G.shake,3);return;}
  kill(e,foc);
}
function kill(e,foc){
  e.dead=true; G.kills++;
  G.combo=Math.min(5,G.combo+.1); G.comboT=2.2;
  G.score+=Math.round((e.depth+1)*10*G.combo*(e.boss?5:1));
  burst(e.x,e.y,colOf(e),8+e.depth*5,170+e.depth*40);
  G.shake=Math.max(G.shake,e.boss?14:3+e.depth*1.5);
  if(e.depth>0&&foc){
    // FOCUS: the base case. The shape ends here with no copies, but pays little.
    if(Math.random()<.35)dropShard(e);
  }else if(e.depth>0){
    // RECURSION: a shape of depth d breaks into copies of itself at depth d-1
    const k=e.sides===3?3:2, base=rnd(0,TAU);
    for(let i=0;i<k;i++){
      const a=base+i*TAU/k,cx=Math.cos(a),cy=Math.sin(a);
      const c=mk(e.sides,e.depth-1,e.x+cx*e.r*.55,e.y+cy*e.r*.55,e.vx*.5+cx*170*U,e.vy*.5+cy*170*U,false);
      c.inv=.2; c.fam=e.fam; c.top=e.boss?e.depth-1:e.top; G.en.push(c);
    }
    if(Math.random()<.25)dropShard(e);
  }else{
    dropShard(e);
    if(Math.random()<.07)dropTok(e);
  }
  // FAMILY BONUS: finish every descendant of one starting shape
  if(e.fam&&e.depth===0&&!G.en.some(x=>!x.dead&&x.fam===e.fam)){
    const b=Math.round(25*(e.top+1)*G.combo); G.score+=b;
    G.toast={t:0,dur:1.6,text:'FAMILY CLEARED +'+b};
    dropShard(e); dropShard(e);
  }
}

/* ---------- waves ---------- */
function nextWave(){
  G.wave++;
  const w=G.wave, idx=(w-1)%4, cyc=Math.floor((w-1)/4);
  const cnt=4+cyc*3+(idx===2?2:0), dep=Math.min(3,1+(idx>0?1:0)+cyc);
  G.queue=[];
  if(idx===3){
    G.queue.push({s:3,d:3,boss:true});
    for(let i=0;i<2+cyc;i++)G.queue.push({s:3,d:Math.min(3,1+cyc)});
  }else{
    for(let i=0;i<cnt;i++){
      const s=idx===0?3:idx===1?4:[3,4,5][i%3];
      G.queue.push({s,d:s===5?Math.min(2,dep):dep});
    }
  }
  G.spawnT=0; G.delay=1.6; G.clearing=false;
  G.banner={t:0,dur:4.4,title:(cyc?'Descent '+(cyc+1)+' · ':'')+CH[idx][0],text:CH[idx][1]};
}
function spawn(sp){
  const m=50*U; let x,y; const side=(Math.random()*4)|0;
  if(side===0){x=rnd(0,W);y=-m}else if(side===1){x=W+m;y=rnd(0,H)}else if(side===2){x=rnd(0,W);y=H+m}else{x=-m;y=rnd(0,H)}
  const e=mk(sp.s,sp.d,x,y,0,0,sp.boss); e.fam=++G.famN; e.top=sp.boss?3:sp.d; G.en.push(e);
}

/* ---------- weapon: every bullet recursively branches ---------- */
function fire(){
  const a=G.ang,x=G.px+Math.cos(a)*16*U,y=G.py+Math.sin(a)*16*U;
  if(G.mode==='focus')G.bullets.push({x,y,a,gen:0,age:0,life:1.2,foc:true,sp:780});
  else G.bullets.push({x,y,a,gen:G.branch,age:0,life:1.0});
}
function toggleMode(){
  if(state!=='play')return;
  G.mode=G.mode==='focus'?'branch':'focus'; syncMode();
}
function syncMode(){
  modeBtn.textContent=G.mode==='focus'?'FOCUS':'BRANCH';
  modeBtn.classList.toggle('focus',G.mode==='focus');
}
function stepBullet(b,dt){
  const v=(b.sp||560)*U;
  b.x+=Math.cos(b.a)*v*dt; b.y+=Math.sin(b.a)*v*dt; b.age+=dt; b.life-=dt;
  if(b.gen>0&&b.age>=.09){
    const sp=.36*Math.pow(.78,G.branch-b.gen);
    G.bullets.push({x:b.x,y:b.y,a:b.a-sp,gen:b.gen-1,age:0,life:b.life});
    G.bullets.push({x:b.x,y:b.y,a:b.a+sp,gen:b.gen-1,age:0,life:b.life});
    b.life=0;
  }
}

/* ---------- Nova: a ring that spawns rings that spawn rings ---------- */
function nova(){
  if(state!=='play'||G.energy<100)return;
  G.energy=0; G.flash=.35;
  G.rings.push({x:G.px,y:G.py,r:8*U,v:380*U,max:140*U,gen:3,dead:false});
}
function stepRing(g,dt){
  g.r+=g.v*dt;
  if(g.r>=g.max){
    g.dead=true;
    if(g.gen>0){
      const o=rnd(0,TAU);
      for(let i=0;i<5;i++){const a=o+i*TAU/5;
        G.rings.push({x:g.x+Math.cos(a)*g.r,y:g.y+Math.sin(a)*g.r,r:3*U,v:g.v*.85,max:g.max*.5,gen:g.gen-1,dead:false});}
    }
    return;
  }
  for(const e of G.en){
    if(e.dead||e.ringT>0)continue;
    const d=Math.hypot(e.x-g.x,e.y-g.y);
    if(Math.abs(d-g.r)<e.r+5){e.ringT=.3;hit(e);}
  }
}

/* ---------- game flow ---------- */
function start(){
  G={t:0,score:0,wave:0,hp:5,energy:0,branch:1,shards:0,need:8,combo:1,comboT:0,
     px:W/2,py:H*.68,pvx:0,pvy:0,ang:-Math.PI/2,inv:0,fireT:.3,shake:0,flash:0,kills:0,
     bullets:[],en:[],parts:[],rings:[],sh:[],sp:[],tok:[],mode:'branch',famN:0,magT:0,mirror:0,mirrorT:0,dft:[0,0,0],drones:[],hil:null,queue:[],spawnT:0,delay:1.2,banner:null,toast:null,clearing:false,nextIn:0};
  state='play'; screenEl.style.display='none'; novaBtn.style.display='block'; modeBtn.style.display='block'; syncMode();
  nextWave();
}
function gameOver(){
  state='over'; novaBtn.style.display='none'; modeBtn.style.display='none';
  burst(G.px,G.py,'#ffffff',60,300);
  const nb=G.score>best; if(nb){best=G.score;try{localStorage.setItem('ff_best',String(best))}catch(e){}}
  setTimeout(()=>{
    panel.innerHTML='<h1 style="font-size:clamp(28px,8vw,44px)">THE VOID FOLDS</h1>'+
      '<p class="sub">the seed is spent, but never lost</p>'+
      '<p class="story">Somewhere inside the wreckage, a smaller Seed is already forming. It remembers you.</p>'+
      '<p class="stat">Score <b>'+G.score+'</b> &nbsp;·&nbsp; Wave <b>'+G.wave+'</b> &nbsp;·&nbsp; Shapes unmade <b>'+G.kills+'</b></p>'+
      '<p class="stat">'+(nb?'<b>New best!</b>':'Best <b>'+best+'</b>')+'</p><br>'+
      '<button class="go" id="go">FIGHT AGAIN</button><div class="row"><button class="sec" data-act="splash">MENU</button></div>';
    screenEl.style.display='flex';
  },800);
}
/* ---------- versioning, settings and splash ---------- */
const APP_VERSION='1.5.0', BUILD_DATE='2026-11-25';
const CHANGELOG=[
 {v:'1.5.0',t:'Stronger shard magnet, plus a Magnet power-up that pulls every shard on screen'},
 {v:'1.4.0',t:'Splash screen, settings, update checker, installable app'},
 {v:'1.3.0',t:'Branch or Focus weapons, regrowth, family bonus, paired power-ups'},
 {v:'1.2.0',t:'Helper power-ups: Mirror Seed and Hilbert Drone'},
 {v:'1.1.0',t:'Sierpinski Shield power-up'},
 {v:'1.0.0',t:'First release: splitting shapes, branching shots, Nova'}
];
const SET={shake:true};
try{const s=JSON.parse(localStorage.getItem('ff_set')||'{}');if(s.shake===false)SET.shake=false;}catch(e){}
const saveSet=()=>{try{localStorage.setItem('ff_set',JSON.stringify(SET))}catch(e){}};
let lastCheck=0,latest=null,ustatus='',resetArm=false;
try{lastCheck=+localStorage.getItem('ff_lastcheck')||0}catch(e){}
const vcmp=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);
  for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;};
const hasUpdate=()=>!!latest&&vcmp(latest.version,APP_VERSION)>0;

function logoSVG(){
  const out=[];
  (function t(ax,ay,bx,by,cx,cy,d){
    if(d===0){out.push([ax,ay,bx,by,cx,cy]);return;}
    const mx=(ax+bx)/2,my=(ay+by)/2,nx=(bx+cx)/2,ny=(by+cy)/2,px=(cx+ax)/2,py=(cy+ay)/2;
    t(ax,ay,mx,my,px,py,d-1);t(mx,my,bx,by,nx,ny,d-1);t(px,py,nx,ny,cx,cy,d-1);
  })(50,6,4,86,96,86,4);
  const A=[78,224,255],B=[178,140,255],C=[255,95,168];
  const mix=(p,q,k)=>p.map((v,i)=>Math.round(v+(q[i]-v)*k));
  const col=y=>{const k=(y-6)/80;const c=k<.5?mix(A,B,k*2):mix(B,C,(k-.5)*2);return 'rgb('+c.join(',')+')';};
  return '<svg class="logo" viewBox="0 0 100 92" width="132" height="122" aria-hidden="true">'+
    out.map(p=>'<polygon points="'+p.join(' ')+'" fill="'+col((p[1]+p[3]+p[5])/3)+'"/>').join('')+'</svg>';
}
function showSplash(){
  state='menu';
  panel.innerHTML='<div class="logo-wrap">'+logoSVG()+'</div><h1>FRACTAL<br>FIGHT</h1>'+
    '<p class="sub">a geometric game of recursion</p>'+
    '<button class="go" id="go">PLAY</button>'+
    '<div class="row"><button class="sec" data-act="how">HOW TO PLAY</button><button class="sec" data-act="settings">SETTINGS</button></div>'+
    (hasUpdate()?'<p class="stat" data-act="settings" style="color:#ffc857;margin-top:14px">Update available: v'+latest.version+'. Tap to update.</p>':'')+
    (best?'<p class="stat" style="margin-top:14px">Best <b>'+best+'</b></p>':'')+
    '<p class="ver">v'+APP_VERSION+'</p>';
  screenEl.style.display='flex';
}
function showSettings(){
  const ago=lastCheck?new Date(lastCheck).toLocaleString():'never';
  panel.innerHTML='<h1 style="font-size:clamp(26px,7vw,36px)">SETTINGS</h1>'+
    '<div class="card"><div class="line"><span>Installed</span><b>v'+APP_VERSION+'</b></div>'+
    '<div class="line"><span>Built</span><b>'+BUILD_DATE+'</b></div>'+
    '<div class="line"><span>Latest</span><b>'+(latest?'v'+latest.version:'unknown')+'</b></div>'+
    '<div class="line"><span>Last checked</span><b>'+ago+'</b></div>'+
    (ustatus?'<p class="stat" style="font-size:13px;color:#ffc857">'+ustatus+'</p>':'')+
    (hasUpdate()?'<button class="go sm" data-act="apply">UPDATE TO v'+latest.version+'</button>'
                :'<button class="go sm" data-act="check">CHECK FOR UPDATES</button>')+'</div>'+
    '<div class="card"><div class="line"><span>Screen shake</span><button class="tog'+(SET.shake?' on':'')+'" data-act="shake">'+(SET.shake?'ON':'OFF')+'</button></div>'+
    '<div class="line"><span>Best score</span><button class="sec sm" data-act="reset">'+(resetArm?'TAP AGAIN TO CONFIRM':'RESET')+'</button></div>'+
    '<div class="line"><span>Cache</span><button class="sec sm" data-act="clear">CLEAR AND RELOAD</button></div></div>'+
    '<div class="card log"><b>What\'s new</b>'+CHANGELOG.map(c=>'<p><i>v'+c.v+'</i>'+c.t+'</p>').join('')+'</div>'+
    '<button class="sec" data-act="splash">BACK</button>';
  screenEl.style.display='flex';
}
async function checkUpdate(silent){
  if(!silent){ustatus='Checking…';showSettings();}
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('http '+r.status);
    latest=await r.json(); lastCheck=Date.now();
    try{localStorage.setItem('ff_lastcheck',String(lastCheck))}catch(e){}
    ustatus=hasUpdate()?'Update available: v'+latest.version+(latest.notes?' · '+latest.notes:''):'You\'re up to date.';
  }catch(e){ustatus=silent?'':'Couldn\'t reach the update server. Check your connection.';}
  if(silent){if(screenEl.style.display!=='none'&&panel.querySelector('.logo-wrap'))showSplash();}
  else showSettings();
}
async function applyUpdate(){
  ustatus='Updating…';showSettings();
  try{
    if('caches' in window)for(const k of await caches.keys())await caches.delete(k);

/* ---------- update ---------- */
function updateFx(dt){
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  G.shake=Math.max(0,G.shake-dt*40);
  if(G.flash>0)G.flash-=dt;
}
function update(dt){
  G.t+=dt;
  // --- movement input
  let ix=0,iy=0;
  if(keys.KeyA||keys.ArrowLeft)ix-=1; if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(keys.KeyW||keys.ArrowUp)iy-=1; if(keys.KeyS||keys.ArrowDown)iy+=1;
  if(ptr){const dx=ptr.x-ptr.ox,dy=ptr.y-ptr.oy,l=Math.hypot(dx,dy);
    if(l>6){const k=Math.min(1,l/(70*U))/l;ix+=dx*k;iy+=dy*k;}}
  else if(mouse.on&&!ix&&!iy){const dx=mouse.x-G.px,dy=mouse.y-G.py,l=Math.hypot(dx,dy);
    if(l>10*U){const k=Math.min(1,l/(70*U))/l;ix+=dx*k;iy+=dy*k;}}
  const il=Math.hypot(ix,iy); if(il>1){ix/=il;iy/=il;}
  const sp=290*U, f=Math.min(1,dt*10);
  G.pvx+=(ix*sp-G.pvx)*f; G.pvy+=(iy*sp-G.pvy)*f;
  G.px=Math.max(18*U,Math.min(W-18*U,G.px+G.pvx*dt));
  G.py=Math.max(50*U,Math.min(H-18*U,G.py+G.pvy*dt));
  if(G.inv>0)G.inv-=dt;

  // --- aim at nearest enemy and auto-fire
  let tgt=null,bd=1e12;
  for(const e of G.en){if(e.dead)continue;const d=(e.x-G.px)**2+(e.y-G.py)**2;if(d<bd){bd=d;tgt=e;}}
  if(tgt){
    const ta=Math.atan2(tgt.y-G.py,tgt.x-G.px);
    let da=ta-G.ang; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
    G.ang+=da*Math.min(1,dt*18);
    G.fireT-=dt;
    if(G.fireT<=0){fire();G.fireT=G.mode==='focus'?.36:.30-.02*G.branch;}
  }

  // --- bullets
  for(const b of G.bullets)stepBullet(b,dt);
  const m=40;
  for(const b of G.bullets){
    if(b.life<=0)continue;
    if(b.x<-m||b.x>W+m||b.y<-m||b.y>H+m){b.life=0;continue;}
    for(const e of G.en){
      if(e.dead)continue;
      const rr=e.r*1.05+3;
      if((e.x-b.x)**2+(e.y-b.y)**2<rr*rr){
        if(e.inv>0)continue;
        hit(e,b.foc); b.life=0; break;
      }
    }
  }
  G.bullets=G.bullets.filter(b=>b.life>0);

  // --- rings
  for(const g of G.rings)stepRing(g,dt);
  G.rings=G.rings.filter(g=>!g.dead);

  // --- shield pieces orbit the player
  {const n=G.sp.length,rho=(30+n*1.8)*U;
   for(let i=0;i<n;i++){const p=G.sp[i],a=G.t*2.2+i*TAU/n;p.x=G.px+Math.cos(a)*rho;p.y=G.py+Math.sin(a)*rho;if(p.cd>0)p.cd-=dt;}}
  // --- enemies
  for(const e of G.en){
    if(e.dead)continue;
    const dx=G.px-e.x,dy=G.py-e.y,l=Math.hypot(dx,dy)||1;
    const s=(e.boss?38:45+(3-e.depth)*25+G.wave*2.5)*U;
    e.vx+=(dx/l*s-e.vx)*dt*.9; e.vy+=(dy/l*s-e.vy)*dt*.9;
    e.x+=e.vx*dt; e.y+=e.vy*dt; e.rot+=e.spin*dt;
    if(e.inv>0)e.inv-=dt; if(e.flash>0)e.flash-=dt; if(e.ringT>0)e.ringT-=dt; if(e.shT>0)e.shT-=dt;
    // REGROWTH: a shape left alone grows back one depth
    if(!e.boss&&e.depth<e.top){
      e.gt+=dt;
      if(e.gt>=6){e.gt=0;e.depth++;e.r=rOf(e.depth,false);e.flash=.2;e.inv=.15;burst(e.x,e.y,colOf(e),14,140);}
    }
    let blocked=false;
    if(e.shT<=0)for(const p of G.sp){
      if(p.cd>0||p.hit)continue;
      if(Math.hypot(e.x-p.x,e.y-p.y)<e.r*.95+(6+p.tier*5)*U){
        p.hit=true; e.shT=.4; e.inv=0; blocked=true;
        burst(p.x,p.y,'#6fb7ff',10+p.tier*4,150); G.shake=Math.max(G.shake,4);
        hit(e); break;
      }
    }
    if(blocked)continue;
    if(G.inv<=0&&l<e.r*.95+13*U){
      G.hp--; G.inv=1.4; G.shake=16;
      burst(G.px,G.py,'#ff6b6b',22,220);
      G.pvx-=dx/l*400*U; G.pvy-=dy/l*400*U;
      e.inv=0; hit(e);
      if(G.hp<=0){gameOver();return;}
    }
  }
  G.en=G.en.filter(e=>!e.dead);
  // SIERPINSKI SHIELD: a struck piece splits into three smaller pieces; the smallest just break
  if(G.sp.some(p=>p.hit)){
    const ns=[];
    for(const p of G.sp){
      if(!p.hit){ns.push(p);continue;}
      if(p.tier>0)for(let j=0;j<3;j++)ns.push({tier:p.tier-1,cd:.35,hit:false,x:p.x,y:p.y});
    }
    G.sp=ns;
  }

  // --- shards
  for(const s of G.sh){
    s.life-=dt;
    const dx=G.px-s.x,dy=G.py-s.y,l=Math.hypot(dx,dy)||1;
    // MAGNET: a strong base pull that grows as shards get closer; the Magnet power-up pulls from anywhere
    const mg=G.magT>0,R=(mg?3000:260)*U;
    if(l<R){const boost=mg?1:1+(1-l/R)*2;s.vx+=dx/l*(mg?2600:1500)*boost*U*dt;s.vy+=dy/l*(mg?2600:1500)*boost*U*dt;}
    s.vx*=.95;s.vy*=.95; s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(l<18*U){
      s.life=0; G.energy=Math.min(100,G.energy+7); G.score+=5; G.shards++;
      if(G.shards>=G.need){
        G.shards=0; G.need+=6;
        if(G.branch<4){G.branch++;G.toast={t:0,dur:1.8,text:'RECURSION DEPTH '+G.branch};}
        else{G.hp=Math.min(5,G.hp+1);G.toast={t:0,dur:1.8,text:'FRACTAL MENDING +1'};}
      }
    }
  }
  G.sh=G.sh.filter(s=>s.life>0);

  // --- shield tokens
  for(const k of G.tok){
    k.life-=dt;
    const dx=G.px-k.x,dy=G.py-k.y,l=Math.hypot(dx,dy)||1;
    if(!k.fork&&l<(G.magT>0?3000:130)*U){const v=(G.magT>0?520:300)*U*dt;k.x+=dx/l*v;k.y+=dy/l*v;}
    if(l<20*U){
      k.life=0;
      if(k.fork)for(const o of G.tok)if(o.fork===k.fork)o.life=0;
      if(k.type==='mirror'){
        G.mirror=Math.min(3,G.mirror+1); G.mirrorT=30;
        G.toast={t:0,dur:1.8,text:G.mirror>1?'MIRROR SEED DEPTH '+G.mirror:'MIRROR SEED'};
      }else if(k.type==='magnet'){
        G.magT=12; G.toast={t:0,dur:1.8,text:'MAGNET'};
      }else if(k.type==='hilbert'){
        startHil(); G.toast={t:0,dur:1.8,text:'HILBERT DRONE'};
      }else if(G.sp.reduce((s,p)=>s+(Math.pow(3,p.tier+1)-1)/2,0)<26){
        G.sp.push({tier:2,cd:.3,hit:false,x:G.px,y:G.py}); G.toast={t:0,dur:1.8,text:'SIERPINSKI SHIELD'};
      }else G.toast={t:0,dur:1.4,text:'SHIELD FULL'};
      burst(G.px,G.py,TCOL[k.type]||'#6fb7ff',16,180);
    }
  }
  G.tok=G.tok.filter(k=>k.life>0);

  // --- MIRROR SEED: drones orbit you, and each drone is orbited by a smaller drone
  if(G.magT>0)G.magT-=dt;
  G.drones=[];
  if(G.mirrorT>0){
    G.mirrorT-=dt;
    let qx=G.px,qy=G.py;
    for(let i=0;i<G.mirror;i++){
      const a=G.t*(1.7+i*.6)*(i%2?-1:1)+i*2.1,rho=(40-i*9)*U,ox=qx,oy=qy;
      qx+=Math.cos(a)*rho; qy+=Math.sin(a)*rho;
      G.drones.push({x:qx,y:qy,ox,oy,k:Math.pow(.62,i+1),i});
    }
    for(const d of G.drones){
      G.dft[d.i]-=dt;
      if(G.dft[d.i]<=0&&G.en.length){
        let tg=null,bd=1e12;
        for(const e of G.en){if(e.dead)continue;const q=(e.x-d.x)**2+(e.y-d.y)**2;if(q<bd){bd=q;tg=e;}}
        if(tg){G.bullets.push({x:d.x,y:d.y,a:Math.atan2(tg.y-d.y,tg.x-d.x),gen:1,age:0,life:.9});G.dft[d.i]=.55;}
      }
    }
    if(G.mirrorT<=0)G.mirror=0;
  }
  // --- HILBERT DRONE: sweeps a space-filling curve across the whole arena
  if(G.hil){
    const h=G.hil; h.i+=dt*13;
    if(h.i>=h.pts.length-1)G.hil=null;
    else{
      const i0=h.i|0,f=h.i-i0,a=h.pts[i0],b=h.pts[i0+1];
      h.x=a[0]+(b[0]-a[0])*f; h.y=a[1]+(b[1]-a[1])*f;
      for(const e of G.en){
        if(e.dead||e.ringT>0)continue;
        if(Math.hypot(e.x-h.x,e.y-h.y)<e.r+18*U){e.ringT=.35;hit(e);}
      }
    }
  }

  // --- waves
  if(G.delay>0)G.delay-=dt;
  else if(G.queue.length){
    G.spawnT-=dt;
    if(G.spawnT<=0&&G.en.length<40){spawn(G.queue.shift());G.spawnT=Math.max(.35,.75-.1*Math.floor((G.wave-1)/4));}
  }else if(!G.en.length&&!G.clearing){G.clearing=true;G.nextIn=2;G.energy=Math.min(100,G.energy+20);
    if(G.wave%3===0)dropPair(rnd(90,W-90),rnd(H*.3,H*.6),14);}
  if(G.clearing){G.nextIn-=dt;if(G.nextIn<=0)nextWave();}

  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=1;}
  if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}
  if(G.toast){G.toast.t+=dt;if(G.toast.t>G.toast.dur)G.toast=null;}
  updateFx(dt);
}

/* ---------- render ---------- */
function bg(t){
  ctx.fillStyle='#070a18'; ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2,ph=(t*.14)%1,rot=-Math.PI/2+t*.03;
  ctx.lineWidth=1.2;
  for(let k=0;k<11;k++){
    const s=14*U*Math.pow(2,k-ph); let a=.16; if(k===0)a*=(1-ph);
    ctx.strokeStyle='rgba(80,110,255,'+a+')';
    ctx.beginPath(); poly(cx,cy,s,rot,3,0); ctx.stroke();
    ctx.beginPath(); poly(cx,cy,s*.5,rot+Math.PI,3,0); ctx.stroke();
  }
}
function wrap(text,maxW){
  const words=text.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur); return lines;
}
function render(){
  bgT=G?G.t:bgT+1/60;
  bg(bgT);
  if(!G)return;
  ctx.save();
  if(G.shake>0&&SET.shake)ctx.translate(rnd(-G.shake,G.shake)*.5,rnd(-G.shake,G.shake)*.5);

  ctx.globalCompositeOperation='lighter';
  // rings
  ctx.lineWidth=2*U;
  for(const g of G.rings){
    const a=.85*(1-.5*g.r/g.max);
    ctx.strokeStyle=['rgba(255,200,87,','rgba(255,95,168,','rgba(178,140,255,','rgba(78,224,255,'][g.gen]+a+')';
    ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,TAU); ctx.stroke();
  }
  // shards
  ctx.fillStyle='#8dffb8';
  for(const s of G.sh){
    if(s.life<2&&((s.life*10)|0)%2)continue;
    ctx.beginPath(); poly(s.x,s.y,6*U,G.t*3,3,0); ctx.fill();
  }
  // magnet field: rings flowing inward
  if(G.magT>0){
    ctx.lineWidth=2*U;
    for(let k=0;k<3;k++){
      const ph=(G.t*.9+k/3)%1,r=(1-ph)*220*U;
      ctx.strokeStyle='rgba(255,143,208,'+(ph*.5)+')';
      ctx.beginPath(); ctx.arc(G.px,G.py,r,0,TAU); ctx.stroke();
    }
  }
  // Hilbert drone trail and Mirror Seed drones
  if(G.hil){
    const h=G.hil,n=Math.min(h.pts.length-1,(h.i|0)+1);
    ctx.strokeStyle='rgba(255,200,87,.55)'; ctx.lineWidth=2*U; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(h.pts[0][0],h.pts[0][1]);
    for(let i=1;i<=n;i++)ctx.lineTo(h.pts[i][0],h.pts[i][1]);
    ctx.lineTo(h.x,h.y); ctx.stroke();
    ctx.fillStyle='#ffc857'; ctx.beginPath(); ctx.arc(h.x,h.y,5*U,0,TAU); ctx.fill();
  }
  ctx.lineWidth=1.6*U;
  for(const d of G.drones){
    ctx.strokeStyle='rgba(125,255,178,.25)'; ctx.beginPath(); ctx.moveTo(d.ox,d.oy); ctx.lineTo(d.x,d.y); ctx.stroke();
    ctx.strokeStyle='#7dffb2'; ctx.fillStyle='rgba(125,255,178,.18)';
    ctx.beginPath(); poly(d.x,d.y,17*U*Math.max(.5,d.k*1.6),G.ang,3,d.i===0?1:0); ctx.stroke();
    ctx.beginPath(); poly(d.x,d.y,17*U*Math.max(.5,d.k*1.6),G.ang,3,0); ctx.fill();
  }
  // shield tokens and shield pieces (each piece contains copies of itself)
  ctx.lineWidth=1.8*U;
  for(const k of G.tok){
    if(k.fork){
      const o=G.tok.find(q=>q!==k&&q.fork===k.fork);
      if(o){ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(k.x,k.y);ctx.lineTo(o.x,o.y);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1.8*U;}
    }
    if(k.life<2&&((k.life*10)|0)%2)continue;
    ctx.strokeStyle=TCOL[k.type]||'#6fb7ff'; ctx.beginPath(); poly(k.x,k.y,10*U,G.t*1.5,({hilbert:4,magnet:6})[k.type]||3,1); ctx.stroke();
  }
  for(let i=0;i<G.sp.length;i++){
    const p=G.sp[i],r=(6+p.tier*5)*U;
    ctx.globalAlpha=p.cd>0?.5:1;
    ctx.fillStyle='rgba(111,183,255,.18)'; ctx.beginPath(); poly(p.x,p.y,r,G.t*2+i,3,0); ctx.fill();
    ctx.strokeStyle='#6fb7ff'; ctx.beginPath(); poly(p.x,p.y,r,G.t*2+i,3,p.tier); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // enemies: one stroked path per shape, containing its own recursion
  ctx.lineWidth=1.7*U; ctx.lineJoin='round';
  for(const e of G.en){
    const c=e.flash>0?'#ffffff':colOf(e);
    ctx.globalAlpha=e.inv>0?.55:1;
    ctx.fillStyle=c; ctx.globalAlpha*=.13;
    ctx.beginPath(); poly(e.x,e.y,e.r,e.rot,e.sides,0); ctx.fill();
    ctx.globalAlpha=e.inv>0?.55:1;
    ctx.strokeStyle=c;
    ctx.beginPath(); poly(e.x,e.y,e.r,e.rot,e.sides,e.depth); ctx.stroke();
    if(!e.boss&&e.depth<e.top&&e.gt>1.5){
      ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2*U;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r*1.45,-Math.PI/2,-Math.PI/2+TAU*e.gt/6); ctx.stroke();
      ctx.lineWidth=1.7*U;
    }
    if(e.boss){
      ctx.globalAlpha=1; ctx.fillStyle='#b28cff'; ctx.fillRect(e.x-30*U,e.y-e.r-14*U,60*U*(e.hp/6),4*U);
    }
  }
  ctx.globalAlpha=1;
  // bullets
  ctx.lineWidth=2.6*U; ctx.lineCap='round';
  for(const b of G.bullets){
    const dx=Math.cos(b.a)*16*U,dy=Math.sin(b.a)*16*U;
    if(b.foc){ctx.lineWidth=4.4*U;ctx.strokeStyle='#ffe29a';}
    else{ctx.lineWidth=2.6*U;ctx.strokeStyle=b.gen===0?'#c8fff0':'#7dffb2';}
    ctx.beginPath(); ctx.moveTo(b.x-dx,b.y-dy); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  // particles
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.c;
    ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  ctx.globalAlpha=1;
  // player: a Seed whose own fractal depth equals your Recursion Depth
  if(state==='play'&&!(G.inv>0&&((G.t*20)|0)%2)){
    ctx.strokeStyle=G.mode==='focus'?'#ffc857':'#7dffb2'; ctx.lineWidth=1.8*U;
    ctx.beginPath(); poly(G.px,G.py,16*U,G.ang,3,G.mode==='focus'?0:Math.min(G.branch,3)); ctx.stroke();
    ctx.fillStyle='rgba(125,255,178,.18)';
    ctx.beginPath(); poly(G.px,G.py,16*U,G.ang,3,0); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.restore();

  // joystick
  if(ptr&&state==='play'){
    ctx.strokeStyle='rgba(180,210,255,.25)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(ptr.ox,ptr.oy,70*U,0,TAU); ctx.stroke();
    const dx=ptr.x-ptr.ox,dy=ptr.y-ptr.oy,l=Math.hypot(dx,dy),k=l>70*U?70*U/l:1;
    ctx.fillStyle='rgba(180,210,255,.3)';
    ctx.beginPath(); ctx.arc(ptr.ox+dx*k,ptr.oy+dy*k,20*U,0,TAU); ctx.fill();
  }
  if(G.flash>0){ctx.fillStyle='rgba(200,240,255,'+(G.flash/.35*.35)+')';ctx.fillRect(0,0,W,H);}
  if(state==='play')hud();
}
function hud(){
  const pad=14*U,fs=14*U;
  ctx.font='700 '+fs+'px system-ui,sans-serif'; ctx.textBaseline='top';
  // hp
  ctx.lineWidth=1.6;
  for(let i=0;i<5;i++){
    ctx.beginPath(); poly(pad+9*U+i*22*U,pad+8*U,8*U,-Math.PI/2,3,0);
    if(i<G.hp){ctx.fillStyle='#ff6b8a';ctx.fill();}
    else{ctx.strokeStyle='rgba(255,107,138,.35)';ctx.stroke();}
  }
  ctx.fillStyle='#cfe3ff'; ctx.textAlign='left';
  ctx.fillText('SCORE '+G.score,pad,pad+24*U);
  ctx.textAlign='center'; ctx.fillText('WAVE '+G.wave,W/2,pad);
  ctx.textAlign='right'; ctx.fillStyle='#7dffb2';
  ctx.fillText('DEPTH '+G.branch+(G.branch>=4?' MAX':''),W-pad,pad);
  if(G.magT>0){ctx.fillStyle='#ff8fd0';ctx.fillText('MAGNET '+Math.ceil(G.magT)+'s',W-pad,pad+(34+(G.sp.length?16:0)+(G.mirror>0?16:0))*U);}
  if(G.mirror>0){ctx.fillStyle='#7dffb2';ctx.fillText('MIRROR '+G.mirror+' · '+Math.ceil(G.mirrorT)+'s',W-pad,pad+(G.sp.length?50:34)*U);}
  if(G.sp.length){ctx.fillStyle='#6fb7ff';ctx.fillText('SHIELD '+G.sp.reduce((s,p)=>s+(Math.pow(3,p.tier+1)-1)/2,0),W-pad,pad+34*U);}
  // shard progress
  const bw=90*U,bx=W-pad-bw,by=pad+22*U;
  ctx.fillStyle='rgba(125,255,178,.2)'; ctx.fillRect(bx,by,bw,4*U);
  ctx.fillStyle='#7dffb2'; ctx.fillRect(bx,by,bw*G.shards/G.need,4*U);
  if(G.combo>1.05){ctx.textAlign='left';ctx.fillStyle='#ffc857';ctx.fillText('x'+G.combo.toFixed(1)+' COMBO',pad,pad+44*U);}
  // nova button fill
  novaBtn.style.setProperty('--p',G.energy+'%');
  novaBtn.classList.toggle('ready',G.energy>=100);
  // banner
  if(G.banner){
    const b=G.banner,k=b.t/b.dur,a=k<.1?k/.1:k>.8?(1-k)/.2:1;
    ctx.globalAlpha=Math.max(0,a); ctx.textAlign='center';
    ctx.fillStyle='#ffffff'; ctx.font='800 '+(22*U)+'px system-ui,sans-serif'; ctx.fillText(b.title,W/2,H*.16);
    ctx.fillStyle='#9fb7e8'; ctx.font='500 '+(14*U)+'px system-ui,sans-serif';
    const ls=wrap(b.text,Math.min(W*.86,520));
    ls.forEach((l,i)=>ctx.fillText(l,W/2,H*.16+34*U+i*20*U));
    ctx.globalAlpha=1;
  }
  if(G.toast){
    const t=G.toast,k=t.t/t.dur; ctx.globalAlpha=Math.max(0,1-k); ctx.textAlign='center';
    ctx.fillStyle='#7dffb2'; ctx.font='800 '+(20*U)+'px system-ui,sans-serif'; ctx.fillText(t.text,W/2,H*.36-k*20);
    ctx.globalAlpha=1;
  }
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||0); last=ts;
  if(G){if(state==='play')update(dt);else updateFx(dt);}
  render();
  requestAnimationFrame(frame);
}
window.__ff={toggle:toggleMode,start,nova,get G(){return G},get state(){return state},update,render};
showSplash();
requestAnimationFrame(frame);
if(location.protocol.startsWith('http')){
  addEventListener('load',()=>{
    try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{});}catch(e){}
    setTimeout(()=>checkUpdate(true),1200);
  });
}
})();
</script>
